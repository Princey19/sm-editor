<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banner Editor</title>
    <meta
      name="description"
      content="Create and customize YouTube banners with ease — drag, resize, and style your banner in seconds."
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Top nav -->
    <div class="banner-resize">
      <a href="https://princey19.github.io/sm-resizer/" target="_blank">
        Banner Resizer</a
      >
    </div>

    <!-- Header -->
    <div class="page-header">
      <h1>Banner Editor</h1>
      <p class="subtitle">
        Design stunning YouTube banners — drag, resize &amp; download in one
        click.
      </p>
    </div>

    <!-- Upload -->
    <div
      class="upload-area"
      onclick="document.getElementById('imageUpload').click()"
    >
      <label for="imageUpload">Click or drag an image to get started</label>
      <span class="upload-btn"> Choose Image</span>
      <p id="notice">Supports JPG, PNG, WEBP</p>
    </div>
    <input type="file" id="imageUpload" accept="image/*" />

    <!-- Controls -->
    <div class="controls" id="controls">
      <!-- Row 1: Background -->
      <div class="ctrl-row">
        <div class="ctrl-group">
          <span class="ctrl-label">Background</span>
          <select id="bgMode">
            <option value="color">Color fill</option>
            <option value="image">Image</option>
          </select>
        </div>
        <div class="ctrl-group" id="bgColorGroup">
          <span class="ctrl-label">Color</span>
          <input type="color" id="bgColor" value="#000000" />
        </div>
        <div class="ctrl-group" id="bgImageLabelGroup" style="display: none">
          <span class="ctrl-label">BG Image</span>
          <label id="bgImageLabel">
            <input type="file" id="bgImageUpload" accept="image/*" />
          </label>
        </div>
        <button id="removeBgImageBtn" style="display: none">✕ Remove BG</button>
      </div>

      <!-- Row 2: Layout -->
      <div class="ctrl-row">
        <div class="ctrl-group">
          <span class="ctrl-label">Zoom</span>
          <input
            type="range"
            id="imageScale"
            min="0.2"
            max="3"
            value="1"
            step="0.01"
            class="slider"
          />
        </div>
        <div class="ctrl-group">
          <span class="ctrl-label">Image Size</span>
          <input
            type="range"
            id="imageSize"
            min="100"
            max="1000"
            value="400"
            class="slider"
          />
        </div>
      </div>

      <!-- Row 3: Text -->
      <div class="ctrl-row">
        <div class="ctrl-group">
          <span class="ctrl-label">Left Text</span>
          <input type="text" id="leftText" placeholder="Left Text" />
        </div>
        <div class="ctrl-group">
          <span class="ctrl-label">Right Text</span>
          <input type="text" id="rightText" placeholder="Right Text" />
        </div>
        <div class="ctrl-group">
          <span class="ctrl-label">Font</span>
          <select id="fontSelect">
            <option value="Arial">Arial</option>
            <option value="Poppins">Poppins</option>
            <option value="Roboto">Roboto</option>
            <option value="Montserrat">Montserrat</option>
            <option value="Impact">Impact</option>
            <option value="Georgia">Georgia</option>
            <option value="Courier New">Courier New</option>
          </select>
        </div>
        <div class="ctrl-group">
          <span class="ctrl-label">Size</span>
          <input
            type="range"
            id="fontSize"
            min="10"
            max="80"
            value="28"
            class="slider"
          />
        </div>
        <div class="ctrl-group">
          <span class="ctrl-label">Color</span>
          <input type="color" id="fontColor" value="#ffffff" />
        </div>
      </div>

      <!-- Row 4: Actions -->
      <div class="ctrl-row">
        <button id="centerBtn">Center Align</button>
        <button id="downloadBtn">Download Banner</button>
      </div>
    </div>

    <!-- Banner canvas -->
    <div id="bannerArea">
      <div id="leftTextDisplay" class="side-text"></div>
      <img id="uploadedImage" alt="Uploaded banner image" />
      <div id="rightTextDisplay" class="side-text"></div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
